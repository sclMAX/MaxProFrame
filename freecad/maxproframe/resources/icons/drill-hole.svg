<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Drill Hole: an upright drill bit (grey) drilling a round hole (red) in the top face of a lying rectangular tube (blue). -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" version="1.1">
  <defs>
    <clipPath id="flutes">
      <rect x="19.5" y="10" width="9" height="13"/>
    </clipPath>
  </defs>
  <g stroke="#302b00" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top face, front face, then the right end with the hollow inside of the tube. -->
    <polygon fill="#729fcf" points="2,34 37,34 46,25 11,25"/>
    <polygon fill="#3465a4" points="2,34 37,34 37,44 2,44"/>
    <polygon fill="#204a87" points="37,34 46,25 46,35 37,44"/>
    <polygon fill="#0b1f3a" points="38.6,33.9 44.4,28.1 44.4,34.6 38.6,40.4"/>
  </g>
  <!-- The hole on the top face: dark inside, red rim. -->
  <ellipse transform="matrix(1,0,0.3,-0.62,24,29.5)" rx="6.2" ry="6.2" fill="#0b1f3a" stroke="#ed2b00" stroke-width="1.8"/>
  <!-- The drill bit, upright, its tip in the hole. -->
  <g stroke="#2e3436" stroke-width="1.2" stroke-linejoin="round">
    <polygon fill="#d3d7cf" points="24,30.5 19.5,23 28.5,23"/>
    <rect x="19.5" y="10" width="9" height="13" fill="#babdb6"/>
    <g clip-path="url(#flutes)" stroke="#555753" stroke-width="2" fill="none">
      <path d="M 18,15 L 30,10.5 M 18,20 L 30,15.5 M 18,25 L 30,20.5 M 18,10 L 30,5.5"/>
    </g>
    <rect x="19.5" y="10" width="9" height="13" fill="none"/>
    <rect x="20.5" y="1" width="7" height="9" fill="#888a85"/>
  </g>
</svg>
