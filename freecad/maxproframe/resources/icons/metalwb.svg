<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="topMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sideMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="webMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="frontGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- 3D Extruded I-Beam (Transparent background, high contrast for light & dark FreeCAD themes) -->
  <g stroke="#0b1521" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Web right face -->
    <polygon points="26.00,26.00 26.00,50.00 46.00,36.00 46.00,12.00" fill="url(#webMetal)"/>
    <!-- Bottom flange top-right face -->
    <polygon points="26.00,50.00 38.00,50.00 58.00,36.00 46.00,36.00" fill="url(#topMetal)"/>
    <!-- Bottom flange right face -->
    <polygon points="38.00,50.00 38.00,58.00 58.00,44.00 58.00,36.00" fill="url(#sideMetal)"/>
    <!-- Top flange top face -->
    <polygon points="6.00,18.00 38.00,18.00 58.00,4.00 26.00,4.00" fill="url(#topMetal)"/>
    <!-- Top flange right face -->
    <polygon points="38.00,18.00 38.00,26.00 58.00,12.00 58.00,4.00" fill="url(#sideMetal)"/>
    <!-- Front Section Face (Gold/Amber) -->
    <polygon points="6.00,18.00 38.00,18.00 38.00,26.00 26.00,26.00 26.00,50.00 38.00,50.00 38.00,58.00 6.00,58.00 6.00,50.00 18.00,50.00 18.00,26.00 6.00,26.00" fill="url(#frontGold)"/>
  </g>

  <!-- Crisp inner highlight on front section for small-size legibility -->
  <polygon points="7.80,19.80 36.20,19.80 36.20,24.20 24.20,24.20 24.20,51.80 36.20,51.80 36.20,56.20 7.80,56.20 7.80,51.80 19.80,51.80 19.80,24.20 7.80,24.20"
           fill="none" stroke="#fef08a" stroke-width="1.0" stroke-linejoin="round" stroke-opacity="0.85"/>
</svg>
