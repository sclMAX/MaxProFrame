<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64px" height="64px" viewBox="0 0 64 64" version="1.1" id="profile-pattern" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="original" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:#729fcf;stop-opacity:1" />
      <stop offset="1" style="stop-color:#3465a4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- The frame edge the copies follow -->
  <path d="M 4,56 H 60" style="fill:none;stroke:#2e3436;stroke-width:3;stroke-linecap:round" />
  <!-- The original piece -->
  <rect x="6" y="8" width="10" height="42" rx="1" ry="1" style="fill:url(#original);stroke:#204a87;stroke-width:2" />
  <!-- Its copies, the links -->
  <rect x="24" y="8" width="10" height="42" rx="1" ry="1" style="fill:#d3d7cf;stroke:#555753;stroke-width:2;stroke-dasharray:4,2" />
  <rect x="42" y="8" width="10" height="42" rx="1" ry="1" style="fill:#d3d7cf;stroke:#555753;stroke-width:2;stroke-dasharray:4,2" />
  <!-- The pitch -->
  <path d="M 11,29 H 45" style="fill:none;stroke:#cc0000;stroke-width:2" />
  <path d="M 45,29 L 39,25 L 39,33 Z" style="fill:#cc0000;stroke:none" />
</svg>
