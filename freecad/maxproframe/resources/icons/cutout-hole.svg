<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Cutout / Hole: a standing rectangular tube (blue) with a rectangular cutout (red) through the wall of its wide face. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" version="1.1">
  <defs>
    <clipPath id="cutout">
      <polygon points="26.1,17.74 33.24,15.22 33.24,34.42 26.1,36.94"/>
    </clipPath>
  </defs>
  <g stroke="#302b00" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Narrow face, wide face, then the top end with the hollow inside of the tube. -->
    <polygon fill="#204a87" points="10,9 21,12.5 21,44.5 10,41"/>
    <polygon fill="#3465a4" points="21,12.5 38,6.5 38,38.5 21,44.5"/>
    <path fill="#729fcf" fill-rule="evenodd" d="M 21,12.5 L 10,9 L 27,3 L 38,6.5 Z M 21.01,11.02 L 14.41,8.92 L 26.99,4.48 L 33.59,6.58 Z"/>
    <polygon fill="#0b1f3a" points="21.01,11.02 14.41,8.92 26.99,4.48 33.59,6.58"/>
  </g>
  <!-- The cutout: the cut wall (red) seen through the opening, the dark inside of the tube, a red outline. -->
  <g clip-path="url(#cutout)" stroke="none">
    <polygon fill="#c43e00" points="26.1,17.74 33.24,15.22 33.24,34.42 26.1,36.94"/>
    <polygon fill="#0b1f3a" points="23.9,17.04 31.04,14.52 31.04,33.72 23.9,36.24"/>
  </g>
  <polygon fill="none" stroke="#ed2b00" stroke-width="1.5" stroke-linejoin="round" points="26.1,17.74 33.24,15.22 33.24,34.42 26.1,36.94"/>
</svg>
