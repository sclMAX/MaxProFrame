<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64px" height="64px" viewBox="0 0 64 64" version="1.1" id="InterlockFingers" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:#729fcf;stop-opacity:1" />
      <stop offset="1" style="stop-color:#3465a4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Two tubes meeting at an End Miter corner, their fingers interlocking at the inner vertex -->
  <path d="M 4,4 H 60 L 44,20 V 26 H 38 V 32 H 32 V 38 H 26 V 44 H 20 V 60 L 4,60 Z"
        style="fill:url(#tube);stroke:#204a87;stroke-width:2;stroke-linejoin:round" />
  <path d="M 44,20 L 20,44" style="fill:none;stroke:#204a87;stroke-width:1.5;stroke-dasharray:3,2" />
</svg>
