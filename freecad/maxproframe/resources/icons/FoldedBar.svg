<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64px" height="64px" viewBox="0 0 64 64" version="1.1" id="FoldedBar" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:#729fcf;stop-opacity:1" />
      <stop offset="1" style="stop-color:#3465a4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- One tube folded into a frame with round outer corners, open at the bottom left -->
  <path d="M 6,40 V 14 A 8,8 0 0 1 14,6 H 50 A 8,8 0 0 1 58,14 V 50 A 8,8 0 0 1 50,58 H 22"
        style="fill:none;stroke:#204a87;stroke-width:12;stroke-linecap:butt" />
  <path d="M 6,40 V 14 A 8,8 0 0 1 14,6 H 50 A 8,8 0 0 1 58,14 V 50 A 8,8 0 0 1 50,58 H 22"
        style="fill:none;stroke:url(#tube);stroke-width:8;stroke-linecap:butt" />
  <!-- The open corner -->
  <path d="M 6,46 L 16,58" style="fill:none;stroke:#cc0000;stroke-width:2;stroke-dasharray:3,2" />
</svg>
