<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64px" height="64px" viewBox="0 0 64 64" version="1.1" id="BendConfigurations" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:#729fcf;stop-opacity:1" />
      <stop offset="1" style="stop-color:#3465a4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- A list of saved configurations -->
  <rect x="30" y="4" width="30" height="36" rx="3" style="fill:#eeeeec;stroke:#555753;stroke-width:2" />
  <path d="M 35,13 H 55 M 35,22 H 55 M 35,31 H 49" style="fill:none;stroke:#555753;stroke-width:3" />
  <!-- One tube corner bent with its radius -->
  <path d="M 10,26 V 48 A 8,8 0 0 0 18,56 H 44"
        style="fill:none;stroke:#204a87;stroke-width:12;stroke-linecap:butt" />
  <path d="M 10,26 V 48 A 8,8 0 0 0 18,56 H 44"
        style="fill:none;stroke:url(#tube);stroke-width:8;stroke-linecap:butt" />
  <!-- The inside bend radius -->
  <path d="M 24,42 L 18,48" style="fill:none;stroke:#cc0000;stroke-width:2" />
  <path d="M 16,50 L 18,44 L 22,48 Z" style="fill:#cc0000;stroke:none" />
