<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64px" height="64px" viewBox="0 0 64 64" version="1.1" id="UnfoldedBar" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#729fcf;stop-opacity:1" />
      <stop offset="1" style="stop-color:#3465a4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- The straight bar with the V notches of its folded corners -->
  <path d="M 2,22 H 16 L 20,34 L 24,22 H 38 L 42,34 L 46,22 H 62 V 42 H 2 Z"
        style="fill:url(#tube);stroke:#204a87;stroke-width:2;stroke-linejoin:round" />
  <!-- X = 0 -->
  <path d="M 2,50 H 20" style="fill:none;stroke:#cc0000;stroke-width:2" />
  <path d="M 20,50 L 14,46 L 14,54 Z" style="fill:#cc0000;stroke:none" />
</svg>
