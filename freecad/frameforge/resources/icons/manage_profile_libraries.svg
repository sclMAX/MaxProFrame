<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="binderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#245999"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6ebf0"/>
    </linearGradient>
    <linearGradient id="steelYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="100%" stop-color="#e6b800"/>
    </linearGradient>
    <linearGradient id="steelOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffaa33"/>
      <stop offset="100%" stop-color="#d96600"/>
    </linearGradient>
    <linearGradient id="steelBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66b3ff"/>
      <stop offset="100%" stop-color="#1a75ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Catalog / Binder Book -->
  <g filter="url(#shadow)">
    <!-- Binder spine & back -->
    <rect x="6" y="8" width="52" height="48" rx="5" ry="5" fill="url(#binderGrad)" stroke="#1a3d66" stroke-width="2"/>
    <!-- Inner page insert -->
    <rect x="12" y="12" width="42" height="40" rx="3" ry="3" fill="url(#pageGrad)" stroke="#b0bec5" stroke-width="1.5"/>
    <!-- Page ruled lines -->
    <line x1="16" y1="18" x2="34" y2="18" stroke="#90a4ae" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="23" x2="30" y2="23" stroke="#b0bec5" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="26" y2="28" stroke="#cfd8dc" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Profiles stacked / displayed in catalog -->
  <!-- 1. Square Hollow Tube (Yellow 3D isometric) -->
  <g filter="url(#shadow)" transform="translate(34, 16)">
    <!-- Outer face front -->
    <rect x="0" y="0" width="18" height="18" rx="2" fill="url(#steelYellow)" stroke="#806600" stroke-width="1.5"/>
    <!-- Inner hollow hole -->
    <rect x="4" y="4" width="10" height="10" rx="1" fill="#245999" stroke="#806600" stroke-width="1"/>
  </g>

  <!-- 2. Equal Leg Angle (Orange L-shape) -->
  <g filter="url(#shadow)" transform="translate(14, 32)">
    <path d="M 0,0 L 6,0 L 6,10 L 16,10 L 16,16 L 0,16 Z" fill="url(#steelOrange)" stroke="#803300" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- 3. Round Pipe / Tube Section (Blue circular hollow) -->
  <g filter="url(#shadow)" transform="translate(35, 36)">
    <circle cx="9" cy="9" r="8" fill="url(#steelBlue)" stroke="#004080" stroke-width="1.5"/>
    <circle cx="9" cy="9" r="4.5" fill="#e6ebf0" stroke="#004080" stroke-width="1"/>
  </g>

  <!-- Small Bookmark / Tag ribbon on top-left -->
  <path d="M 10,8 L 16,8 L 16,20 L 13,17 L 10,20 Z" fill="#e53935" stroke="#b71c1c" stroke-width="1"/>
</svg>
