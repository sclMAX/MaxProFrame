name: Nightly native flakiness

on:
  schedule:
    # Once a day, off-peak (UTC).
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Runs of the full suite in the original order (1-20)'
        required: false
        default: '3'
      seed:
        description: 'Integer seed for the shuffled run (default: derived from the run id)'
        required: false

permissions:
  contents: read

jobs:
  flakiness:
    name: Native FreeCAD 1.1.4 repeated runs
    runs-on: ubuntu-24.04
    # A run is the suite in ci.yml's shards, each stopped at the per-shard timeout of the stable target (2 x 480 s).
    # The budget covers every shard of the maximum 20 repetitions plus the shuffled run timing out (336 minutes),
    # plus setup and summary, within GitHub's 360-minute limit.
    timeout-minutes: 355

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ci/targets.json is the single source of truth for the pinned stable runtime (see docs/ci.md).
      - name: Read pinned stable target
        id: target
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          with open("ci/targets.json", encoding="utf-8") as handle:
              stable = json.load(handle)["stable"]
          # The run step loops over shards and passes the timeout: refuse anything but a positive integer.
          for key in ("timeout", "shards"):
              value = stable[key]
              if type(value) is not int or value < 1:
                  sys.exit(f"ci/targets.json: stable {key} must be a positive integer, got {value!r}")
          print("url=" + stable["url"])
          print("sha256=" + stable["sha256"])
          print(f"timeout={stable['timeout']}")
          print(f"shards={stable['shards']}")
          PY

      - name: Install minimal headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 gdb

      - name: Restore cached FreeCAD AppImage
        id: appimage-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/FreeCAD.AppImage
          key: freecad-appimage-${{ steps.target.outputs.sha256 }}

      - name: Download FreeCAD AppImage
        if: steps.appimage-cache.outputs.cache-hit != 'true'
        env:
          STABLE_URL: ${{ steps.target.outputs.url }}
        run: |
          curl -fL -o "${{ runner.temp }}/FreeCAD.AppImage" "$STABLE_URL"

      - name: Verify FreeCAD AppImage checksum
        env:
          STABLE_SHA256: ${{ steps.target.outputs.sha256 }}
        run: |
          echo "$STABLE_SHA256  ${{ runner.temp }}/FreeCAD.AppImage" | sha256sum -c -

      - name: Extract AppImage
        run: |
          chmod +x "${{ runner.temp }}/FreeCAD.AppImage"
          cd "${{ runner.temp }}" && ./FreeCAD.AppImage --appimage-extract

      # Every run executes, even after a failure; the step fails at the end if any run failed.
      - name: Run native test repetitions
        env:
          REPETITIONS: ${{ inputs.repetitions || '3' }}
          SHUFFLE_SEED: ${{ inputs.seed || github.run_id }}
          TIMEOUT: ${{ steps.target.outputs.timeout }}
          SHARDS: ${{ steps.target.outputs.shards }}
        run: |
          if [[ ! "$REPETITIONS" =~ ^[0-9]+$ ]] || (( REPETITIONS < 1 || REPETITIONS > 20 )); then
            echo "repetitions must be an integer from 1 to 20 (got '$REPETITIONS')" >&2
            exit 2
          fi
          if [[ ! "$SHUFFLE_SEED" =~ ^[0-9]+$ ]]; then
            echo "seed must be a non-negative integer (got '$SHUFFLE_SEED')" >&2
            exit 2
          fi
          reports="${{ runner.temp }}/nightly-reports"
          failed_reports="${{ runner.temp }}/failed-reports"
          results="${{ runner.temp }}/nightly-results.tsv"
          failed=0
          : > "$results"

          # One run is every shard of the suite, as ci.yml splits it; a shuffled run shuffles inside each shard.
          run_once() {
            local label="$1" order="$2" shard
            shift 2
            for shard in $(seq 1 "$SHARDS"); do
              if python3 ci/run_tests.py \
                --freecad-bin "${{ runner.temp }}/squashfs-root/AppRun" \
                --reports "$reports/run-$label-$shard" \
                --timeout "$TIMEOUT" \
                --target stable \
                --shard "$shard/$SHARDS" "$@"; then
                printf '%s\t%s\tpassed\n' "$label-$shard" "$order, shard $shard/$SHARDS" >> "$results"
              else
                printf '%s\t%s\tFAILED\n' "$label-$shard" "$order, shard $shard/$SHARDS" >> "$results"
                mkdir -p "$failed_reports"
                cp -r "$reports/run-$label-$shard" "$failed_reports/run-$label-$shard"
                failed=1
              fi
            done
          }

          for n in $(seq 1 "$REPETITIONS"); do
            run_once "$n" "original order"
          done
          run_once "shuffled" "shuffled, seed $SHUFFLE_SEED" --shuffle-seed "$SHUFFLE_SEED"

          exit "$failed"

      - name: Summarize runs
        if: always()
        run: |
          python3 - "${{ runner.temp }}/nightly-results.tsv" "${{ runner.temp }}/nightly-reports" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          sys.path.insert(0, "ci")
          import crash_diagnosis

          results, reports = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          print("## Nightly native flakiness\n")
          print("| Run | Order / seed | Result | Tests | Crash test |")
          print("|-----|--------------|--------|-------|------------|")
          lines = results.read_text(encoding="utf-8").splitlines() if results.is_file() else []
          for line in lines:
              label, order, result = line.split("\t")
              run_dir = reports / f"run-{label}"
              tests, crash = "n/a", "-"
              try:
                  tests = str(json.loads((run_dir / "summary.json").read_text(encoding="utf-8"))["tests"])
              except (OSError, ValueError, KeyError):
                  pass
              if (run_dir / crash_diagnosis.REPORT_NAME).is_file():
                  crash = crash_diagnosis.inflight_test(crash_diagnosis.read_text(run_dir / "tests.log")) or "unknown"
              print(f"| {label} | {order} | {result} | {tests} | {crash} |")
          if not lines:
              print("| - | no run completed | - | - | - |")
          PY

      - name: Upload failing run reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-failure-reports
          path: ${{ runner.temp }}/failed-reports
          if-no-files-found: ignore
          retention-days: 7
