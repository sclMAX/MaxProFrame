name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base Git reference for change comparison'
        required: false
        default: 'HEAD^'
      native_diagnostics:
        description: 'Manual stable-only native stack and structural Qt evidence'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  format:
    name: Code Formatting (Black & isort)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Plan changed files
        env:
          INPUT_BASE_REF: ${{ github.event.inputs.base_ref }}
        run: |
          python3 ci/changed_files.py > "${{ runner.temp }}/changes.json"

      - name: Install pinned formatting tools
        run: |
          python -m pip install -r ci/requirements-format.txt

      - name: Check code formatting
        run: |
          python3 ci/check_format.py --changes "${{ runner.temp }}/changes.json" --reports "${{ runner.temp }}/format-reports"

      - name: Upload format failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: format-failure-reports
          path: ${{ runner.temp }}/format-reports
          retention-days: 7

  test:
    name: Native FreeCAD (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Weekly is informative: its failure is visible but does not fail the workflow. Stable stays blocking.
    continue-on-error: ${{ matrix.target == 'weekly' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: stable
            label: FreeCAD 1.1.4
            url: https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
            sha256: f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434
            timeout: 420
          - target: weekly
            label: FreeCAD weekly-2026.10.28
            url: https://github.com/FreeCAD/FreeCAD/releases/download/weekly-2026.10.28/FreeCAD_weekly-2026.10.28-Linux-x86_64.AppImage
            sha256: 34d6b2fa3d6686fce67ed8b3013fa7526da4051ac61012a8b34a8214682a5b2b
            timeout: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Plan changed files
        id: planner
        env:
          INPUT_BASE_REF: ${{ github.event.inputs.base_ref }}
        run: |
          python3 ci/changed_files.py > "${{ runner.temp }}/changes.json"

      - name: Run host CI policy regression tests
        run: |
          python3 -m unittest discover -s ci/tests -p 'test_*.py' -v

      - name: Install minimal headless dependencies
        if: steps.planner.outputs.run_tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install manual native debugger
        if: github.event_name == 'workflow_dispatch' && inputs.native_diagnostics && matrix.target == 'stable'
        run: |
          sudo apt-get install -y --no-install-recommends gdb

      - name: Download and verify FreeCAD AppImage
        if: steps.planner.outputs.run_tests == 'true'
        run: |
          curl -fL -o "${{ runner.temp }}/FreeCAD.AppImage" \
            "${{ matrix.url }}"
          echo "${{ matrix.sha256 }}  ${{ runner.temp }}/FreeCAD.AppImage" | sha256sum -c -

      - name: Extract AppImage
        if: steps.planner.outputs.run_tests == 'true'
        run: |
          chmod +x "${{ runner.temp }}/FreeCAD.AppImage"
          cd "${{ runner.temp }}" && ./FreeCAD.AppImage --appimage-extract

      - name: Run native FreeCAD tests
        if: steps.planner.outputs.run_tests == 'true'
        env:
          NATIVE_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.native_diagnostics && matrix.target == 'stable' }}
        run: |
          diagnostic_args=()
          if [[ "$NATIVE_DIAGNOSTICS" == "true" ]]; then diagnostic_args+=(--native-diagnostics); fi
          python3 ci/run_tests.py \
            --freecad-bin "${{ runner.temp }}/squashfs-root/AppRun" \
            --reports "${{ runner.temp }}/test-reports" \
            --timeout ${{ matrix.timeout }} \
            --target "${{ matrix.target }}" "${diagnostic_args[@]}"

      - name: Upload test failure reports
        if: failure() || (always() && github.event_name == 'workflow_dispatch' && inputs.native_diagnostics && matrix.target == 'stable')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failure-reports-${{ matrix.target }}
          path: ${{ runner.temp }}/test-reports
          retention-days: 7
