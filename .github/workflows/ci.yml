name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base Git reference for change comparison'
        required: false
        default: 'HEAD^'
      native_diagnostics:
        description: 'Manual stable-only native stack and structural Qt evidence'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Cancel superseded runs of the same branch or PR; every main commit keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Code Formatting (Black & isort)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Plan changed files
        env:
          INPUT_BASE_REF: ${{ github.event.inputs.base_ref }}
        run: |
          python3 ci/changed_files.py > "${{ runner.temp }}/changes.json"

      - name: Install pinned formatting tools
        run: |
          python -m pip install -r ci/requirements-format.txt

      - name: Check code formatting
        run: |
          python3 ci/check_format.py --changes "${{ runner.temp }}/changes.json" --reports "${{ runner.temp }}/format-reports"

      - name: Upload format failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: format-failure-reports
          path: ${{ runner.temp }}/format-reports
          retention-days: 7

  targets:
    name: Read pinned FreeCAD targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      gates: ${{ steps.matrix.outputs.gates }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ci/targets.json is the single source of truth for the pinned runtimes (see docs/ci.md).
      - name: Build the target matrix
        id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("ci/targets.json", encoding="utf-8") as handle:
              targets = json.load(handle)
          keys = ("label", "url", "sha256", "timeout", "blocking")
          # One job per target shard; the gate matrix has one `Native FreeCAD (<target>)` job per target.
          include = [
              {"target": name, "shard": shard, "shards": data["shards"], **{key: data[key] for key in keys}}
              for name, data in targets.items()
              for shard in range(1, data["shards"] + 1)
          ]
          gates = [{"target": name, "blocking": data["blocking"]} for name, data in targets.items()]
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          print("gates=" + json.dumps({"include": gates}, separators=(",", ":")))
          PY

  test:
    name: Native FreeCAD (${{ matrix.target }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only targets marked `blocking` in ci/targets.json can fail the workflow; the weekly build is informative.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Plan changed files
        id: planner
        env:
          INPUT_BASE_REF: ${{ github.event.inputs.base_ref }}
        run: |
          python3 ci/changed_files.py > "${{ runner.temp }}/changes.json"

      - name: Run host CI policy regression tests
        run: |
          python3 -m unittest discover -s ci/tests -p 'test_*.py' -v

      - name: Install minimal headless dependencies
        if: steps.planner.outputs.run_tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 gdb

      - name: Restore cached FreeCAD AppImage
        id: appimage-cache
        if: steps.planner.outputs.run_tests == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/FreeCAD.AppImage
          key: freecad-appimage-${{ matrix.sha256 }}

      - name: Download and verify FreeCAD AppImage
        if: steps.planner.outputs.run_tests == 'true' && steps.appimage-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL -o "${{ runner.temp }}/FreeCAD.AppImage" \
            "${{ matrix.url }}"

      - name: Verify FreeCAD AppImage checksum
        if: steps.planner.outputs.run_tests == 'true'
        run: |
          echo "${{ matrix.sha256 }}  ${{ runner.temp }}/FreeCAD.AppImage" | sha256sum -c -

      - name: Extract AppImage
        if: steps.planner.outputs.run_tests == 'true'
        run: |
          chmod +x "${{ runner.temp }}/FreeCAD.AppImage"
          cd "${{ runner.temp }}" && ./FreeCAD.AppImage --appimage-extract

      - name: Run native FreeCAD tests
        if: steps.planner.outputs.run_tests == 'true'
        env:
          NATIVE_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.native_diagnostics && matrix.target == 'stable' }}
        run: |
          diagnostic_args=()
          if [[ "$NATIVE_DIAGNOSTICS" == "true" ]]; then diagnostic_args+=(--native-diagnostics); fi
          python3 ci/run_tests.py \
            --freecad-bin "${{ runner.temp }}/squashfs-root/AppRun" \
            --reports "${{ runner.temp }}/test-reports" \
            --timeout ${{ matrix.timeout }} \
            --target "${{ matrix.target }}" \
            --shard "${{ matrix.shard }}/${{ matrix.shards }}" "${diagnostic_args[@]}"

      - name: Upload test failure reports
        if: failure() || (always() && github.event_name == 'workflow_dispatch' && inputs.native_diagnostics && matrix.target == 'stable')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failure-reports-${{ matrix.target }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-reports
          retention-days: 7

  native:
    name: Native FreeCAD (${{ matrix.target }})
    needs: [targets, test]
    # Branch protection requires these names. A skipped required check counts as passed,
    # so the gate always runs and fails itself when a blocking target's shard failed.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.gates) }}

    steps:
      # Non-blocking shards run with continue-on-error, so only blocking shards can make needs.test.result fail.
      - name: Check shard results
        env:
          TARGET: ${{ matrix.target }}
          BLOCKING: ${{ matrix.blocking }}
          SHARDS_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$BLOCKING" != "true" ]]; then
            echo "::notice::Native FreeCAD ($TARGET) is informative: its shard jobs show its result and never fail the workflow (shard jobs result: '$SHARDS_RESULT')."
          elif [[ "$SHARDS_RESULT" == "success" ]]; then
            echo "Native FreeCAD ($TARGET): every blocking shard job passed (result '$SHARDS_RESULT')."
          else
            echo "::error::Native FreeCAD ($TARGET) is blocking and its shard jobs ended with '$SHARDS_RESULT'."
            exit 1
          fi
